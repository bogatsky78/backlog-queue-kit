# Те, що після `backlog init` доводиться дописати в <проєкт>/backlog/config.yml
# РУКАМИ. Причина не в лінощах: `backlog config set` на обох цих ключах
# відповідає «cannot be set directly».
#
# УВАГА: CLI при кожному записі конфіга (будь-який `config set`) переписує файл
# і ВИКИДАЄ З НЬОГО ВСІ YAML-КОМЕНТАРІ. Тому коментарі сюди не переносьте —
# пояснення живуть у скілі.

# Четвертий статус. `init` дає лише три; "Later" — це «відкладене», і переводить
# туди лише власник.
statuses: ["To Do", "In Progress", "Later", "Done"]

# Гейт на правила проєкту, спільний для всіх задач: показується в `task view`,
# закривається `--check-dod`. Це заготовка — переписати під проєкт.
#
# Два пункти варто лишити майже дослівно.
#
# Про [NEEDS CLARIFICATION: ...] — бо гачок перевіряє ці маркери при переході в
# "In Progress", і DoD-пункт робить правило видимим у кожній задачі.
#
# Про документ — бо це єдиний призначений момент, коли опис фічі переїжджає з
# нотатки задачі в документацію (див. скіл `docs`). Без нього документація
# відстає не з ліні, а тому, що ніхто не назвав, коли її писати.
definition_of_done:
  - "Перевірки з Acceptance Criteria відмічені (--check-ac), а не описані словами"
  - "Багатослівний вивід пішов у файл, а не в контекст"
  - "Числа наведені як числа, а не прикметниками"
  - "Нічого не опубліковано й не розгорнуто без окремого слова власника"
  - "Зміна функціоналу відображена в документі поточного стану й у карті фіч, а не лише в нотатці задачі"
  - "Незакритих [NEEDS CLARIFICATION: ...] у задачі не лишилось"

# Ще три значення, які варто перевірити після init (їх `config set` приймає):
#   auto_commit: false          — обов'язково; інакше CLI комітить сам
#   remote_operations: false    — якщо працюєте в одну гілку, знімає походи в мережу
#   check_active_branches: false — те саме, прискорює будь-яке звертання до черги
